syntax = "proto3";

package streamsync;

option java_package = "com.streamsync.protocol";
option java_multiple_files = true;
option swift_prefix = "SS";

// ============================================================================
// StreamSync Protocol v2.0
// Peer-to-peer instant file transfer & content streaming protocol
// ============================================================================

// --- Core Enums ---

enum DeviceType {
  DEVICE_UNKNOWN = 0;
  DEVICE_ANDROID = 1;
  DEVICE_IOS = 2;
  DEVICE_DESKTOP_WINDOWS = 3;
  DEVICE_DESKTOP_MACOS = 4;
  DEVICE_DESKTOP_LINUX = 5;
  DEVICE_WEB = 6;
  DEVICE_TV = 7;
}

enum TransferType {
  TRANSFER_FILE = 0;
  TRANSFER_STREAM = 1;
  TRANSFER_CLIPBOARD = 2;
  TRANSFER_URL = 3;
  TRANSFER_TEXT = 4;
  TRANSFER_CONTACT = 5;
  TRANSFER_SCREEN_MIRROR = 6;
}

enum TransferStatus {
  STATUS_PENDING = 0;
  STATUS_TRANSFERRING = 1;
  STATUS_PAUSED = 2;
  STATUS_COMPLETED = 3;
  STATUS_FAILED = 4;
  STATUS_CANCELLED = 5;
}

enum StreamType {
  STREAM_VIDEO = 0;
  STREAM_AUDIO = 1;
  STREAM_SCREEN = 2;
  STREAM_CAMERA = 3;
  STREAM_MICROPHONE = 4;
  STREAM_FILE = 5;
}

enum EncryptionScheme {
  ENCRYPTION_NONE = 0;
  ENCRYPTION_AES_256_GCM = 1;
  ENCRYPTION_CHACHA20_POLY1305 = 2;
  ENCRYPTION_TLS_1_3 = 3;
}

enum CompressionType {
  COMPRESSION_NONE = 0;
  COMPRESSION_GZIP = 1;
  COMPRESSION_ZSTD = 2;
  COMPRESSION_LZ4 = 3;
}

// --- Discovery & Identity ---

message DeviceIdentity {
  string device_id = 1;
  string device_name = 2;
  DeviceType device_type = 3;
  string os_version = 4;
  string app_version = 5;
  uint32 protocol_version = 6;
  repeated Capability capabilities = 7;
  bytes public_key = 8;  // Ed25519 public key for identity verification
}

message Capability {
  string feature = 1;     // e.g. "streaming", "file_transfer", "screen_mirror"
  uint32 version = 2;
  map<string, string> params = 3;
}

// --- Discovery Messages ---

message DiscoveryMessage {
  oneof msg {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    Goodbye goodbye = 3;
    ServiceQuery service_query = 4;
    ServiceResponse service_response = 5;
  }
}

message Hello {
  DeviceIdentity identity = 1;
  uint32 listen_port = 2;
  repeated string advertised_services = 3;
  bytes session_token = 4;
}

message HelloAck {
  DeviceIdentity identity = 1;
  bool accept_connection = 2;
  string reason = 3;
}

message Goodbye {
  string reason = 1;
  uint32 reconnect_delay_seconds = 2;
}

message ServiceQuery {
  string service_type = 1;
  map<string, string> filters = 2;
}

message ServiceResponse {
  repeated DeviceIdentity devices = 1;
}

// --- Transfer Messages ---

message TransferMessage {
  oneof msg {
    TransferRequest request = 1;
    TransferResponse response = 2;
    TransferChunk chunk = 3;
    TransferComplete complete = 4;
    TransferError error = 5;
    TransferPause pause = 6;
    TransferResume resume = 7;
    TransferCancel cancel = 8;
    TransferMetadata metadata = 9;
    TransferProgress progress = 10;
  }
}

message FileInfo {
  string file_id = 1;
  string filename = 2;
  uint64 file_size = 3;
  string mime_type = 4;
  bytes file_hash = 5;          // SHA-256 hash
  string relative_path = 6;
  map<string, string> metadata = 7;
}

message TransferRequest {
  string transfer_id = 1;
  TransferType transfer_type = 2;
  string sender_id = 3;
  string target_id = 4;
  EncryptionScheme encryption = 5;
  CompressionType compression = 6;

  // File transfer
  repeated FileInfo files = 10;

  // Streaming
  StreamType stream_type = 11;
  string stream_url = 12;
  uint32 stream_port = 13;
  map<string, string> stream_params = 14;

  // Text/URL/Clipboard
  string text_payload = 20;
  string url_payload = 21;
  bytes clipboard_data = 22;
  string clipboard_mime = 23;

  // Screen mirroring
  uint32 screen_width = 30;
  uint32 screen_height = 31;
  uint32 screen_fps = 32;
  uint32 screen_quality = 33;

  // Common
  uint64 total_size = 40;
  map<string, string> custom_headers = 41;
}

message TransferResponse {
  string transfer_id = 1;
  bool accepted = 2;
  string reason = 3;
  uint32 max_chunk_size = 4;
  uint64 offset = 5;           // For resume support
  repeated string missing_chunks = 6;
  string alt_stream_url = 7;   // Alternative streaming URL
}

message TransferChunk {
  string transfer_id = 1;
  string file_id = 2;
  uint64 offset = 3;
  uint32 length = 4;
  bytes data = 5;
  uint32 chunk_index = 6;
  uint32 total_chunks = 7;
  bytes checksum = 8;          // CRC32C of chunk data
  bool is_encrypted = 9;
}

message TransferComplete {
  string transfer_id = 1;
  repeated string file_ids = 2;
  uint64 total_bytes = 3;
  uint64 elapsed_ms = 4;
  double avg_speed_mbps = 5;
  bytes final_hash = 6;        // SHA-256 of all data
}

message TransferError {
  string transfer_id = 1;
  uint32 error_code = 2;
  string error_message = 3;
  bool retryable = 4;
  map<string, string> error_details = 5;
}

message TransferPause {
  string transfer_id = 1;
  string reason = 2;
}

message TransferResume {
  string transfer_id = 1;
  repeated string file_ids = 2;
}

message TransferCancel {
  string transfer_id = 1;
  string reason = 2;
}

message TransferMetadata {
  string transfer_id = 1;
  map<string, string> metadata = 2;
}

message TransferProgress {
  string transfer_id = 1;
  string file_id = 2;
  uint64 bytes_transferred = 3;
  uint64 total_bytes = 4;
  double speed_mbps = 5;
  uint32 progress_percent = 6;
  uint64 estimated_remaining_ms = 7;
}

// --- Streaming Messages ---

message StreamMessage {
  oneof msg {
    StreamStart start = 1;
    StreamStop stop = 2;
    StreamPacket packet = 3;
    StreamControl control = 4;
    StreamQuality quality = 5;
    StreamKeepalive keepalive = 6;
  }
}

message StreamStart {
  string stream_id = 1;
  StreamType stream_type = 2;
  string session_id = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 fps = 6;
  uint32 bitrate_kbps = 7;
  string codec = 8;
  bool has_audio = 9;
  map<string, string> params = 10;
}

message StreamStop {
  string stream_id = 1;
  string reason = 2;
}

message StreamPacket {
  string stream_id = 1;
  uint64 sequence = 2;
  uint64 timestamp_ms = 3;
  bool keyframe = 4;
  bytes data = 5;
  bool is_video = 6;
  bool is_audio = 7;
  uint32 data_type = 8;  // 0=h264, 1=h265, 2=vp9, 3=opus, 4=aac
}

message StreamControl {
  string stream_id = 1;
  enum Command {
    PLAY = 0;
    PAUSE = 1;
    RESUME = 2;
    SEEK = 3;
    STOP = 4;
    SET_VOLUME = 5;
    MUTE = 6;
    UNMUTE = 7;
  }
  Command command = 2;
  int64 param = 3;  // Seek position, volume level, etc.
}

message StreamQuality {
  string stream_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 bitrate_kbps = 4;
  uint32 fps = 5;
}

message StreamKeepalive {
  string stream_id = 1;
  uint64 timestamp_ms = 2;
}

// --- Screen Mirroring ---

message ScreenFrame {
  string session_id = 1;
  uint64 sequence = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes jpeg_data = 5;    // JPEG compressed frame
  uint32 quality = 6;      // 1-100
  bool is_delta = 7;
  repeated Rect dirty_regions = 8;
  uint64 timestamp_ms = 9;
}

message Rect {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message InputEvent {
  string session_id = 1;
  uint64 timestamp_ms = 2;
  oneof event {
    TouchEvent touch = 10;
    KeyEvent key = 11;
    MouseEvent mouse = 12;
    ScrollEvent scroll = 13;
  }
}

message TouchEvent {
  uint32 pointer_id = 1;
  enum Action {
    DOWN = 0;
    UP = 1;
    MOVE = 2;
    CANCEL = 3;
  }
  Action action = 2;
  float x = 3;
  float y = 4;
  float pressure = 5;
  float size = 6;
}

message KeyEvent {
  uint32 key_code = 1;
  bool is_press = 2;
  bool is_long_press = 3;
  string chars = 4;
}

message MouseEvent {
  enum Action {
    MOVE = 0;
    PRESS = 1;
    RELEASE = 2;
    CLICK = 3;
    DOUBLE_CLICK = 4;
    DRAG = 5;
  }
  Action action = 1;
  float x = 2;
  float y = 3;
  uint32 buttons = 4;
}

message ScrollEvent {
  float delta_x = 1;
  float delta_y = 2;
  bool is_trackpad = 3;
}

// --- Clipboard Sync ---

message ClipboardMessage {
  string session_id = 1;
  uint64 timestamp_ms = 2;
  oneof content {
    string text = 10;
    bytes image_data = 11;
    string image_mime = 12;
    ClipFile file = 13;
    ClipRichText rich_text = 14;
  }
  string source_device_id = 20;
}

message ClipFile {
  string filename = 1;
  uint64 size = 2;
  string mime_type = 3;
  string file_id = 4;
}

message ClipRichText {
  string html = 1;
  string plain_text = 2;
  map<string, string> styles = 3;
}

// --- Control Messages ---

message ControlMessage {
  oneof msg {
    Ping ping = 1;
    Pong pong = 2;
    PairRequest pair_request = 3;
    PairResponse pair_response = 4;
    DeviceListRequest device_list_request = 5;
    DeviceListResponse device_list_response = 6;
    Heartbeat heartbeat = 7;
    Notification notification = 8;
  }
}

message Ping {
  uint64 timestamp_ms = 1;
  bytes nonce = 2;
}

message Pong {
  uint64 timestamp_ms = 1;
  bytes nonce = 2;
  uint64 server_timestamp_ms = 3;
}

message PairRequest {
  string device_id = 1;
  string device_name = 2;
  bytes pairing_secret = 3;  // Encrypted with recipient's public key
  bool auto_accept = 4;
}

message PairResponse {
  bool accepted = 1;
  string device_name = 2;
  bytes pairing_secret = 3;
  string reason = 4;
}

message DeviceListRequest {
  bool include_inactive = 1;
}

message DeviceListResponse {
  repeated DeviceInfo devices = 1;
}

message DeviceInfo {
  string device_id = 1;
  string device_name = 2;
  DeviceType device_type = 3;
  bool is_active = 4;
  uint32 signal_strength = 5;
  ConnectionInfo connection = 6;
}

message ConnectionInfo {
  string ip_address = 1;
  uint32 port = 2;
  enum ConnectionType {
    WIFI = 0;
    CELLULAR = 1;
    ETHERNET = 2;
    BLUETOOTH = 3;
    USB = 4;
    HOTSPOT = 5;
  }
  ConnectionType connection_type = 3;
  int32 rssi = 4;
  uint32 bandwidth_estimate_mbps = 5;
}

message Heartbeat {
  uint64 timestamp_ms = 1;
  double battery_level = 2;
  bool is_charging = 3;
  uint32 active_transfers = 4;
}

message Notification {
  string title = 1;
  string body = 2;
  string action = 3;
  map<string, string> action_params = 4;
  uint32 priority = 5;
  string sound = 6;
}

// --- Wrapper ---

message StreamSyncMessage {
  uint32 protocol_version = 1;
  uint64 message_id = 2;
  uint64 timestamp_ms = 3;
  string sender_id = 4;
  bytes sender_signature = 5;

  oneof payload {
    // Discovery
    DiscoveryMessage discovery = 10;
    // Transfer
    TransferMessage transfer = 11;
    // Stream
    StreamMessage stream = 12;
    // Screen
    ScreenFrame screen_frame = 13;
    InputEvent input_event = 14;
    // Clipboard
    ClipboardMessage clipboard = 15;
    // Control
    ControlMessage control = 16;
  }
}
