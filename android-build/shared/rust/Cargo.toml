[package]
name = "streamsync-core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust core library for StreamSync - protocol serialization, mDNS discovery, WebSocket transport, encryption"

[lib]
name = "streamsync_core"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Protobuf serialization
prost = "0.13"
prost-types = "0.13"

# WebSocket transport
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2"
tungstenite = "0.24"

# mDNS/DNS-SD discovery
mdns-sd = "0.13"

# Encryption
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"

# Serialization helpers
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
bincode = "1"
bytes = "1"

# Streaming/media
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Compression
flate2 = "1"

# MIME type detection
mime_guess = "2"

# Hex encoding (for tests and display)
hex = "0.4"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.0.1"

[features]
default = ["full"]
full = []