[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsync-cli"
version = "1.0.0"
description = "Cross-platform desktop companion app for StreamSync - file transfer, content streaming, and clipboard sync for devices without a native streaming client"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "StreamSync Contributors"}
]
requires-python = ">=3.9"
keywords = ["streamsync", "file-transfer", "streaming", "clipboard-sync", "mDNS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: Multimedia :: Video :: Display",
]

dependencies = [
    "click>=8.1.0",
    "zeroconf>=0.132.0",
    "websockets>=12.0",
    "cryptography>=42.0.0",
    "pyperclip>=1.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.5.0",
]
tui = [
    "textual>=0.52.0",
    "textual-dev>=1.5.0",
]
streaming = [
    "python-vlc>=3.0.0",
]
all = [
    "streamsync-cli[gui,tui,streaming]",
]

[project.scripts]
streamsync = "streamsync_cli.ui.cli_app:cli"

[project.urls]
Homepage = "https://github.com/streamsync/streamsync"
Documentation = "https://streamsync.readthedocs.io"

[tool.setuptools.packages.find]
include = ["streamsync_cli*"]
