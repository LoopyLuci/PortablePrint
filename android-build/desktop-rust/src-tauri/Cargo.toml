[package]
name = "streamsync-desktop"
version = "1.0.0"
description = "StreamSync Desktop Companion (Tauri)"
authors = ["StreamSync Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
mdns-sd = "0.13"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
whoami = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
